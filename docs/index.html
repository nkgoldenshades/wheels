  <!-- 🔒 DISABLE DEVELOPER CONSOLE IN PRODUCTION -->
  <script>
    // Only block console in production (deployed websites)
    // Allow console in development (localhost)
    (function() {
      const isProduction = window.location.hostname !== 'localhost' 
                        && window.location.hostname !== '127.0.0.1'
                        && !window.location.hostname.includes('.local');
      
      if (isProduction) {
        // Disable console methods
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
        console.info = function() {};
        console.debug = function() {};
        
        // Disable right-click (context menu)
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });
        
        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        document.addEventListener('keydown', function(e) {
          if (e.keyCode === 123 || 
              (e.ctrlKey && e.shiftKey && e.keyCode === 73) ||
              (e.ctrlKey && e.shiftKey && e.keyCode === 74) ||
              (e.ctrlKey && e.shiftKey && e.keyCode === 67) ||
              (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            return false;
          }
        });
      } else {
        console.log('🔧 Development mode - Console enabled');
      }
    })();
  </script>

  <!-- Razorpay Checkout.js for web payments -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <!-- Razorpay Flutter Bridge -->
  <script>
    window.openRazorpay = function(options) {
      return new Promise(function(resolve, reject) {
        try {
          var rzpOptions = {
            key: options.key,
            amount: options.amount,
            currency: options.currency || 'INR',
            name: options.name || 'VaultWheels',
            description: options.description || '',
            prefill: {
              name: options.prefill_name || '',
              email: options.prefill_email || '',
              contact: options.prefill_contact || '',
            },
            theme: { color: options.theme_color || '#1976D2' },
            modal: {
              ondismiss: function() {
                resolve(JSON.stringify({ error: 'Payment cancelled by user' }));
              }
            },
            handler: function(response) {
              resolve(JSON.stringify({
                payment_id: response.razorpay_payment_id,
                order_id: response.razorpay_order_id || '',
                signature: response.razorpay_signature || '',
              }));
            }
          };

          if (options.order_id && options.order_id !== '') {
            rzpOptions.order_id = options.order_id;
          }

          var rzp = new Razorpay(rzpOptions);
          rzp.on('payment.failed', function(response) {
            resolve(JSON.stringify({
              error: response.error.description || 'Payment failed',
              code: response.error.code || '',
            }));
          });
          rzp.open();
        } catch(e) {
          resolve(JSON.stringify({ error: e.toString() }));
        }
      });
    };
  </script>
