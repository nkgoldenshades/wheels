<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VaultWheels - Your Transport Partner">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VaultWheels">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <title>VaultWheels</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Use system fonts to avoid Google Fonts timeout -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Web Speech API polyfill hint for browsers -->
  <script>
    // Enable microphone access for Web Speech API
    window.addEventListener('load', function() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        console.log('✅ Web Speech API available');
      } else {
        console.log('⚠️ Web Speech API not available in this browser');
      }
    });
  </script>
  
  <!-- Razorpay Checkout.js for web payments -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <!-- Razorpay Flutter Bridge -->
  <script>
    window.openRazorpay = function(options) {
      return new Promise(function(resolve, reject) {
        try {
          var rzpOptions = {
            key: options.key,
            amount: options.amount,
            currency: options.currency || 'INR',
            name: options.name || 'VaultWheels',
            description: options.description || '',
            prefill: {
              name: options.prefill_name || '',
              email: options.prefill_email || '',
              contact: options.prefill_contact || '',
            },
            theme: { color: options.theme_color || '#1976D2' },
            modal: {
              ondismiss: function() {
                resolve(JSON.stringify({ error: 'Payment cancelled by user' }));
              }
            },
            handler: function(response) {
              resolve(JSON.stringify({
                payment_id: response.razorpay_payment_id,
                order_id: response.razorpay_order_id || '',
                signature: response.razorpay_signature || '',
              }));
            }
          };

          // Only set order_id if provided and non-empty
          if (options.order_id && options.order_id !== '') {
            rzpOptions.order_id = options.order_id;
          }

          var rzp = new Razorpay(rzpOptions);
          rzp.on('payment.failed', function(response) {
            resolve(JSON.stringify({
              error: response.error.description || 'Payment failed',
              code: response.error.code || '',
            }));
          });
          rzp.open();
        } catch(e) {
          resolve(JSON.stringify({ error: e.toString() }));
        }
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
